# AT (Asymmetric Tokenizer) 超参数配置 —— 适用于 Dobot RDP 任务
# 参考：at_umi_rdp.yaml

horizon: 32
n_obs_steps: 2
dataset_obs_temporal_downsample_ratio: 2

policy:
  horizon: ${horizon}
  n_latent_dims: 4
  mlp_layer_num: 1
  use_conv_encoder: True
  conv_latent_dims: 32
  conv_layer_num: 1
  use_rnn_decoder: True
  rnn_latent_dims: 32
  rnn_layer_num: 1
  kl_multiplier: 1.0e-6
  n_embed: 16
  # ==============
  use_vq: False
  vqvae_groups: 4
  eval: false
  act_scale: 1
